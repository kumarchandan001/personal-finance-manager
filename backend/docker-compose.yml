# ============================================
# FINTELIA — Docker Compose (Local Dev)
# ============================================

services:
  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintelia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintelia_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fintelia_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintelia} -d ${POSTGRES_DB:-fintelia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- FastAPI Backend ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fintelia}:${POSTGRES_PASSWORD:-fintelia_secret}@db:5432/${POSTGRES_DB:-fintelia_db}
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source for hot-reload in development
      - .:/app
    # Override CMD for dev: use uvicorn with auto-reload
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  pgdata:
    driver: local
