# ============================================
# FINTELIA — Render.com Deployment Blueprint
# https://render.com/docs/blueprint-spec
# ============================================

services:
  # ---------- FastAPI Web Service ----------
  - type: web
    name: fintelia-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintelia-db
          property: connectionString
        # Render provides postgresql:// — append +asyncpg in the app or use the value as-is
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false   # manually set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false   # manually set in Render dashboard
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  # ---------- PostgreSQL Database ----------
  - name: fintelia-db
    plan: starter
    region: oregon
    databaseName: fintelia_db
    user: fintelia
    postgresMajorVersion: "16"
